[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# A readable block of words beats a forty-element list literal.
ignore = ["SIM905"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
warn_unused_ignores = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# mypy cannot see through pydantic's @computed_field stacked on @property.
# The models are still fully typed; only the decorator pairing is unsupported.
[[tool.mypy.overrides]]
module = "src.models"
disable_error_code = ["prop-decorator"]
