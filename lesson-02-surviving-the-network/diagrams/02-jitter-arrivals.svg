    <style>
      .cap { font: 600 14px "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; fill: #1b2430; }
      .sub { font: 13px "Segoe UI", system-ui, sans-serif; fill: #5a6b81; }
      .ttl { font: 600 17px "Segoe UI", system-ui, sans-serif; fill: #1b2430; }
      .num { font: 700 15px "Segoe UI", system-ui, sans-serif; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="840" height="410" fill="#ffffff"/>
  <text class="ttl" x="420" y="30" text-anchor="middle" dominant-baseline="middle">Forty clients fail together. When do they come back?</text>

  <text class="cap" x="40" y="76" dominant-baseline="middle" fill="#b3541e">all waiting the same time</text>
