<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 410" width="840" height="410" role="img" aria-labelledby="t2 d2">
  <title id="t2">What jitter does to a service coming back up</title>
  <desc id="d2">Two dot plots on the same time axis. Forty clients fail at the same instant and each waits before trying again. In the upper plot every client waits exactly the same time, so all forty land on one moment as a single tall column. In the lower plot each wait is multiplied by a random amount between a half and one and a half, so arrivals spread across a wide band and at most eight land together. The service that was recovering sees a spike in the first case and a trickle in the second.</desc>
