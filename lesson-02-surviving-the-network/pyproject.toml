[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# SIM905: a readable block of words beats a forty-element list literal.
# SIM117: the inner context manager takes its argument from the outer one
#         (the client needs store.url), so combining them makes a long line
#         that reads worse than the nesting it replaces.
ignore = ["SIM905", "SIM117"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
warn_unused_ignores = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# mypy cannot see through pydantic's @computed_field stacked on @property.
# The models are still fully typed; only the decorator pairing is unsupported.
[[tool.mypy.overrides]]
module = "src.models"
disable_error_code = ["prop-decorator"]
